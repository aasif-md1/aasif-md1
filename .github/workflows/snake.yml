name: Update commit snake

on:
  schedule:
    - cron: "30 18 * * *"   # every night at 00:00 IST
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feed the snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_snake.py --user "$GH_USER" --out assets/snake.svg
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --cached --quiet; then echo "No change."; else git commit -m "chore: refresh commit snake" && git push; fi
